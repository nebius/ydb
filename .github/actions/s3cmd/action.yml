name: configure s3cmd
description: Configure s3cmd and artifact paths (adapted from ydb-platform/ydb)
inputs:
  s3_key_id:
    required: true
    description: S3 access key ID
  s3_key_secret:
    required: true
    description: S3 secret access key
  s3_bucket:
    required: true
    description: S3 bucket name
  s3_endpoint:
    required: true
    description: HTTPS S3 service endpoint, without bucket name
  s3_region:
    description: S3 bucket region
    default: us-east-1
  public_acl:
    description: Set public-read ACL; false uses bucket policy
    default: 'false'
  folder_prefix:
    description: Artifact folder prefix
  build_preset:
    description: Build preset
runs:
  using: composite
  steps:
    - name: configure s3cmd
      shell: bash
      env:
        S3_KEY_ID: ${{ inputs.s3_key_id }}
        S3_KEY_SECRET: ${{ inputs.s3_key_secret }}
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        S3_REGION: ${{ inputs.s3_region }}
        S3_PUBLIC_ACL: ${{ inputs.public_acl }}
      run: |
        umask 077
        S3CMD_CONFIG=$(mktemp)
        echo "S3CMD_CONFIG=$S3CMD_CONFIG" >> "$GITHUB_ENV"
        if [[ "$S3_PUBLIC_ACL" == true ]]; then
          echo 'S3_PUBLIC_ACL_FLAG=--acl-public' >> "$GITHUB_ENV"
        else
          echo 'S3_PUBLIC_ACL_FLAG=' >> "$GITHUB_ENV"
        fi
        host=${S3_ENDPOINT#https://}
        host=${host#http://}
        host=${host%/}
        cat <<EOF > "$S3CMD_CONFIG"
        [default]
        access_key = ${S3_KEY_ID}
        secret_key = ${S3_KEY_SECRET}
        bucket_location = ${S3_REGION}
        host_base = ${host}
        host_bucket = %(bucket)s.${host}
        EOF
        MIME_TYPES_LINE="text/plain                                      out err log"
        MIME_TYPES_FILE='/etc/mime.types'
        sudo bash -c "grep -qF -- '$MIME_TYPES_LINE' '$MIME_TYPES_FILE' || echo '$MIME_TYPES_LINE' >> '$MIME_TYPES_FILE'"

    - name: export s3 path variables
      shell: bash
      if: inputs.build_preset != ''
      env:
        S3_BUCKET: ${{ inputs.s3_bucket }}
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        BUILD_PRESET: ${{ inputs.build_preset }}
        FOLDER_PREFIX: ${{ inputs.folder_prefix }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        case "$RUNNER_ARCH" in
          X64) folder=x86-64 ;;
          ARM64) folder=arm64 ;;
          *) folder=unknown ;;
        esac
        case "$BUILD_PRESET" in
          relwithdebinfo) ;;
          debug) folder+="-debug" ;;
          release*) folder+="-${BUILD_PRESET/release-/}" ;;
          *) echo "Invalid preset: $BUILD_PRESET" >&2; exit 1 ;;
        esac
        S3_ENDPOINT=${S3_ENDPOINT%/}
        prefix="${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}/${GITHUB_RUN_ID}/${FOLDER_PREFIX}${folder}"
        public_prefix=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$prefix")
        echo "S3_BUCKET_PATH=s3://${S3_BUCKET}/${prefix}" >> "$GITHUB_ENV"
        echo "S3_URL_PREFIX=${S3_ENDPOINT}/${S3_BUCKET}/${public_prefix}" >> "$GITHUB_ENV"
        echo "S3_TEST_ARTIFACTS_BUCKET_PATH=s3://${S3_BUCKET}/testing_out_stuff/${prefix}" >> "$GITHUB_ENV"
        echo "S3_TEST_ARTIFACTS_URL_PREFIX=${S3_ENDPOINT}/${S3_BUCKET}/testing_out_stuff/${public_prefix}" >> "$GITHUB_ENV"
