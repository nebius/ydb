# Thin remote host. Triggered by the host VM after a platform webhook.
# Run context comes ONLY from the platform Actions artifact `remote-ticket`
# (VM downloads it via GitHub API and passes config.inputs here).
# Never read platform S3. Claim + build outputs → this repo's public S3 only.
name: CI remote executor
run-name: CI remote executor · ${{ inputs.platform_run_id }}/${{ inputs.platform_run_attempt }} · ${{ inputs.code_ref }}

on:
  workflow_dispatch:
    inputs:
      platform_run_id:
        description: 'ydb-platform/ydb Actions run id (claim key / waiter)'
        required: true
        type: string
      platform_run_attempt:
        description: 'Platform github.run_attempt (avoids re-run attaching to stale claim)'
        required: true
        type: string
      platform_repository:
        description: 'Platform repo that published remote-ticket'
        required: true
        type: string
      code_ref:
        description: 'ydb-platform/ydb ref/SHA to checkout and test'
        required: true
        type: string
      job_inputs:
        description: 'JSON object of build_and_test_ya public params (no secrets)'
        required: true
        type: string
      runs_on:
        description: 'JSON array of GitHub runs-on labels'
        required: true
        type: string

concurrency:
  group: ci-remote-executor-${{ inputs.platform_run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claim:
    name: claim · ${{ inputs.platform_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runs_on: ${{ steps.validate.outputs.runs_on }}
      code_ref: ${{ steps.validate.outputs.code_ref }}
      build_target: ${{ steps.validate.outputs.build_target }}
      build_preset: ${{ steps.validate.outputs.build_preset }}
      run_tests: ${{ steps.validate.outputs.run_tests }}
      increment: ${{ steps.validate.outputs.increment }}
      fetch_depth: ${{ steps.validate.outputs.fetch_depth }}
      test_size: ${{ steps.validate.outputs.test_size }}
      test_type: ${{ steps.validate.outputs.test_type }}
      test_threads: ${{ steps.validate.outputs.test_threads }}
      link_threads: ${{ steps.validate.outputs.link_threads }}
      test_retry_count: ${{ steps.validate.outputs.test_retry_count }}
      put_build_results_to_cache: ${{ steps.validate.outputs.put_build_results_to_cache }}
      collect_coredumps: ${{ steps.validate.outputs.collect_coredumps }}
      custom_branch_name: ${{ steps.validate.outputs.custom_branch_name }}
      analytics_job_name: ${{ steps.validate.outputs.analytics_job_name }}
      additional_ya_make_args: ${{ steps.validate.outputs.additional_ya_make_args }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_RUN_ATTEMPT: ${{ inputs.platform_run_attempt }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
          CODE_REF: ${{ inputs.code_ref }}
          JOB_INPUTS: ${{ inputs.job_inputs }}
          RUNS_ON: ${{ inputs.runs_on }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          errors = []
          def err(msg):
              errors.append(msg)

          env = os.environ
          if not re.fullmatch(r"[0-9]+", env["PLATFORM_RUN_ID"]):
              err("platform_run_id must be digits")
          if not re.fullmatch(r"[0-9]+", env["PLATFORM_RUN_ATTEMPT"]):
              err("platform_run_attempt must be digits")
          if env["PLATFORM_REPOSITORY"] != "ydb-platform/ydb":
              err(f"platform_repository must be ydb-platform/ydb, got {env['PLATFORM_REPOSITORY']!r}")
          code_ref = env["CODE_REF"]
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", code_ref):
              err(f"code_ref has invalid characters: {code_ref!r}")

          allowed_labels = {"self-hosted", "linux", "amd64-large", "arm64-large"}
          try:
              runs_on = json.loads(env["RUNS_ON"])
          except json.JSONDecodeError as e:
              runs_on = None
              err(f"runs_on is not valid JSON: {e}")
          if runs_on is not None:
              if not (isinstance(runs_on, list) and runs_on and all(isinstance(x, str) for x in runs_on)):
                  err("runs_on must be a non-empty JSON array of strings")
              elif "self-hosted" not in runs_on or not set(runs_on) <= allowed_labels:
                  err(f"runs_on labels not allowed: {runs_on!r} (allowed: {sorted(allowed_labels)})")

          bools = ("run_tests", "increment", "put_build_results_to_cache", "collect_coredumps")
          ints = ("fetch_depth", "test_threads", "link_threads")
          required = bools + ints + (
              "build_target", "build_preset", "test_size",
              "custom_branch_name", "analytics_job_name",
          )
          optional = ("test_type", "test_retry_count", "additional_ya_make_args")

          try:
              data = json.loads(env["JOB_INPUTS"])
          except json.JSONDecodeError as e:
              data = None
              err(f"job_inputs is not valid JSON: {e}")
          out = {}
          if data is not None and not isinstance(data, dict):
              err("job_inputs must be a JSON object")
          elif data is not None:
              unknown = sorted(set(data) - set(required) - set(optional))
              if unknown:
                  err(f"job_inputs unknown keys: {', '.join(unknown)}")
              for k in required + optional:
                  v = data.get(k)
                  if v is None:
                      v = ""
                  if isinstance(v, bool):
                      v = "true" if v else "false"
                  if not isinstance(v, str):
                      err(f"job_inputs.{k} must be string or bool")
                      continue
                  if "\n" in v or "\r" in v:
                      err(f"job_inputs.{k} must be single-line")
                  out[k] = v
              for k in required:
                  if k in out and not out[k].strip():
                      err(f"job_inputs.{k} is required")
              for k in bools:
                  if out.get(k) and out[k] not in ("true", "false"):
                      err(f"job_inputs.{k} must be true/false, got {out[k]!r}")
              for k in ints + ("test_retry_count",):
                  if out.get(k) and not re.fullmatch(r"[0-9]+", out[k]):
                      err(f"job_inputs.{k} must be digits, got {out[k]!r}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          out["runs_on"] = json.dumps(runs_on, separators=(",", ":"))
          out["code_ref"] = code_ref
          with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Checkout host CI helpers
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions/s3cmd
          sparse-checkout-cone-mode: false

      - name: Install s3cmd
        shell: bash
        run: pipx install s3cmd

      - name: Configure host s3cmd
        uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ vars.AWS_BUCKET }}
          s3_endpoint: ${{ vars.AWS_ENDPOINT }}
          s3_region: ${{ vars.AWS_REGION }}
          public_acl: 'false'

      - name: Publish claim for platform waiter
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_RUN_ATTEMPT: ${{ inputs.platform_run_attempt }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
          CLAIM_BUCKET: ${{ vars.AWS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          platform_run_id = os.environ["PLATFORM_RUN_ID"]
          attempt = os.environ["PLATFORM_RUN_ATTEMPT"]
          bucket = os.environ["CLAIM_BUCKET"]
          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          acl = (os.environ.get("S3_PUBLIC_ACL_FLAG") or "").strip()
          claim = {
              "version": 1,
              "status": "dispatched",
              "platform_run_id": platform_run_id,
              "platform_run_attempt": attempt,
              "platform_repository": os.environ["PLATFORM_REPOSITORY"],
              "executor_run_id": run_id,
              "executor_run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "executor_repository": repo,
              "claimed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          key = f"remote-claims/{platform_run_id}.json"
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "claim.json"
              path.write_text(json.dumps(claim, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              cmd = [
                  "s3cmd", "put", "--no-progress",
                  "--no-mime-magic", "--guess-mime-type",
                  str(path), f"s3://{bucket}/{key}",
              ]
              if acl:
                  cmd.insert(2, acl)
              print("+", " ".join(cmd), flush=True)
              subprocess.check_call(cmd)
          print(json.dumps(claim, indent=2))
          print(f"::notice title=Claim published::s3://{bucket}/{key} attempt={attempt}")
          PY

  execute:
    name: build_and_test_ya · ${{ needs.claim.outputs.code_ref }}
    needs: claim
    runs-on: ${{ fromJSON(needs.claim.outputs.runs_on) }}
    timeout-minutes: 1080
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Checkout ydb-platform/ydb
        uses: actions/checkout@v5
        with:
          repository: ydb-platform/ydb
          ref: ${{ needs.claim.outputs.code_ref }}
          fetch-depth: ${{ needs.claim.outputs.fetch_depth }}
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || github.token }}
          persist-credentials: false

      - name: Check platform action supports remote mode
        env:
          CODE_REF: ${{ needs.claim.outputs.code_ref }}
        shell: bash
        run: |
          action=.github/actions/build_and_test_ya/action.yml
          for input in source_run_id enable_ydb_qa; do
            if ! grep -qE "^[[:space:]]+${input}:" "$action"; then
              echo "::error::$action at $CODE_REF has no '${input}' input; code_ref predates remote executor support"
              exit 1
            fi
          done

      - name: Build and test (platform action from checkout)
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ needs.claim.outputs.build_preset }}
          build_target: ${{ needs.claim.outputs.build_target }}
          run_tests: ${{ needs.claim.outputs.run_tests }}
          increment: ${{ needs.claim.outputs.increment }}
          test_size: ${{ needs.claim.outputs.test_size }}
          test_type: ${{ needs.claim.outputs.test_type }}
          test_threads: ${{ needs.claim.outputs.test_threads }}
          link_threads: ${{ needs.claim.outputs.link_threads }}
          test_retry_count: ${{ needs.claim.outputs.test_retry_count }}
          put_build_results_to_cache: ${{ needs.claim.outputs.put_build_results_to_cache }}
          collect_coredumps: ${{ needs.claim.outputs.collect_coredumps }}
          custom_branch_name: ${{ needs.claim.outputs.custom_branch_name }}
          analytics_job_name: ${{ needs.claim.outputs.analytics_job_name }}
          source_run_id: ${{ inputs.platform_run_id }}
          enable_ydb_qa: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ needs.claim.outputs.additional_ya_make_args }}
          secs: >-
            ${{ format('{{"AWS_KEY_ID":{0},"AWS_KEY_VALUE":{1},"REMOTE_CACHE_USERNAME":{2},"REMOTE_CACHE_PASSWORD":{3},"YDBOT_TELEGRAM_BOT_TOKEN":{4}}}',
              toJSON(secrets.AWS_KEY_ID), toJSON(secrets.AWS_KEY_VALUE),
              toJSON(secrets.REMOTE_CACHE_USERNAME), toJSON(secrets.REMOTE_CACHE_PASSWORD),
              toJSON(secrets.YDBOT_TELEGRAM_BOT_TOKEN)) }}
          vars: >-
            ${{ format('{{"AWS_BUCKET":{0},"AWS_ENDPOINT":{1},"AWS_REGION":{2},"AWS_PUBLIC_ACL":"false","REMOTE_CACHE_URL":{3},"GH_ALERTS_TG_LOGINS":{4},"GH_ALERTS_TG_CHAT":{5}}}',
              toJSON(vars.AWS_BUCKET), toJSON(vars.AWS_ENDPOINT), toJSON(vars.AWS_REGION),
              toJSON(vars.REMOTE_CACHE_URL_YA), toJSON(vars.GH_ALERTS_TG_LOGINS), toJSON(vars.GH_ALERTS_TG_CHAT)) }}

      - name: Publish remote artifacts locator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for v in S3_BUCKET_PATH PUBLIC_DIR PUBLIC_DIR_URL ORIGINAL_HEAD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v missing; cannot publish remote_artifacts.json"
              exit 1
            fi
          done
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          bucket_path = os.environ["S3_BUCKET_PATH"]
          if not bucket_path.startswith("s3://"):
              sys.exit(f"::error::S3_BUCKET_PATH must be s3://...; got {bucket_path!r}")
          bucket, _, key_prefix = bucket_path[len("s3://"):].partition("/")
          run_prefix = "/".join((os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_WORKFLOW"], os.environ["GITHUB_RUN_ID"]))
          if not key_prefix.startswith(run_prefix + "/"):
              sys.exit(f"::error::S3_BUCKET_PATH {bucket_path!r} is not under run root {run_prefix!r}")

          public_dir = Path(os.environ["PUBLIC_DIR"])
          if not public_dir.is_dir():
              sys.exit(f"::error::PUBLIC_DIR {public_dir!r} is not a directory")

          files: list[str] = []
          root = public_dir.resolve()
          for path in sorted(public_dir.rglob("*")):
              if not path.is_file():
                  continue
              try:
                  rel = path.resolve().relative_to(root).as_posix()
              except ValueError:
                  print(f"::warning::skipping path outside PUBLIC_DIR: {path}", file=sys.stderr)
                  continue
              if not rel or rel.startswith("/") or "\\" in rel or ".." in rel.split("/"):
                  print(f"::warning::skipping unsafe relative path {rel!r}", file=sys.stderr)
                  continue
              files.append(rel)

          if "ci_metrics.jsonl" not in files:
              sys.exit("::error::PUBLIC_DIR listing missing ci_metrics.jsonl")

          try_dirs = sorted({m.group(1) for rel in files for m in [re.match(r"(try_\d+)/", rel)] if m},
                            key=lambda s: int(s.split("_", 1)[1]))
          for tn in try_dirs:
              for suffix in ("report.json", "ya-test.html", "started_at", "index.html"):
                  need = f"{tn}/{suffix}"
                  if need not in files:
                      sys.exit(f"::error::PUBLIC_DIR listing missing {need}")

          meta = {
              "version": 1,
              "artifact_key_prefix": key_prefix,
              "public_dir_url": os.environ["PUBLIC_DIR_URL"].rstrip("/"),
              "commit": os.environ["ORIGINAL_HEAD"],
              "files": files,
          }
          out = os.path.join(os.environ["RUNNER_TEMP"], "remote_artifacts.json")
          with open(out, "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          url = f"s3://{bucket}/{run_prefix}/remote_artifacts.json"
          cmd = ["s3cmd", "put", "--no-progress", "--no-mime-magic", "--guess-mime-type", out, url]
          acl = (os.environ.get("S3_PUBLIC_ACL_FLAG") or "").strip()
          if acl:
              cmd.insert(2, acl)
          print("+", " ".join(cmd), flush=True)
          subprocess.check_call(cmd)
          print(f"::notice title=Remote artifacts::{url}")
          PY
