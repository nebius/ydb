# Thin remote host. Triggered by the host VM after a platform webhook.
# Run context comes ONLY from the platform Actions artifact `remote-ticket`
# (VM downloads it via GitHub API and passes config.inputs here).
# Never read platform S3. Claim + build outputs → this repo's public S3 only.
name: CI remote executor

on:
  workflow_dispatch:
    inputs:
      platform_run_id:
        description: 'ydb-platform/ydb Actions run id (claim key / waiter)'
        required: true
        type: string
      platform_run_attempt:
        description: 'Platform github.run_attempt (avoids re-run attaching to stale claim)'
        required: true
        type: string
      platform_repository:
        description: 'Platform repo that published remote-ticket'
        required: true
        type: string
      code_ref:
        description: 'ydb-platform/ydb ref/SHA to checkout and test'
        required: true
        type: string
      job_inputs:
        description: 'JSON object of build_and_test_ya public params (no secrets)'
        required: true
        type: string
      runs_on:
        description: 'JSON array of GitHub runs-on labels'
        required: true
        type: string

concurrency:
  group: ci-remote-executor-${{ inputs.platform_run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execute:
    name: build_and_test_ya · ${{ inputs.code_ref }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 1440
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Checkout host CI helpers
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions/s3cmd
          sparse-checkout-cone-mode: false

      - name: Configure host s3cmd
        uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ vars.AWS_BUCKET }}
          s3_endpoint: ${{ vars.AWS_ENDPOINT }}
          s3_region: ${{ vars.AWS_REGION }}
          public_acl: 'false'

      - name: Publish claim for platform waiter
        id: claim
        env:
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
          PLATFORM_RUN_ATTEMPT: ${{ inputs.platform_run_attempt }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
          CLAIM_BUCKET: ${{ vars.AWS_BUCKET }}
          S3_PUBLIC_ACL_FLAG: ${{ env.S3_PUBLIC_ACL_FLAG }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          platform_run_id = os.environ["PLATFORM_RUN_ID"]
          attempt = os.environ["PLATFORM_RUN_ATTEMPT"].strip()
          if not attempt:
              raise SystemExit("PLATFORM_RUN_ATTEMPT empty")
          bucket = os.environ["CLAIM_BUCKET"]
          run_id = os.environ["GITHUB_RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          acl = (os.environ.get("S3_PUBLIC_ACL_FLAG") or "").strip()
          claim = {
              "version": 1,
              "status": "dispatched",
              "platform_run_id": platform_run_id,
              "platform_run_attempt": attempt,
              "platform_repository": os.environ["PLATFORM_REPOSITORY"],
              "executor_run_id": run_id,
              "executor_run_url": f"{server}/{repo}/actions/runs/{run_id}",
              "executor_repository": repo,
              "claimed_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          key = f"remote-claims/{platform_run_id}.json"
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "claim.json"
              path.write_text(json.dumps(claim, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              cmd = [
                  "s3cmd", "put", "--no-progress",
                  "--no-mime-magic", "--guess-mime-type",
                  str(path), f"s3://{bucket}/{key}",
              ]
              if acl:
                  cmd.insert(2, acl)
              print("+", " ".join(cmd), flush=True)
              subprocess.check_call(cmd)
          print(json.dumps(claim, indent=2))
          print(f"::notice title=Claim published::s3://{bucket}/{key} attempt={attempt}")
          PY

      - name: Parse job_inputs
        id: ya
        env:
          JOB_INPUTS: ${{ inputs.job_inputs }}
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, uuid

          raw = os.environ.get("JOB_INPUTS") or ""
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::job_inputs is not valid JSON: {e}")
              sys.exit(1)
          if not isinstance(data, dict):
              print("::error::job_inputs must be a JSON object")
              sys.exit(1)

          def as_str(key, default=""):
              if key not in data or data[key] is None:
                  return default
              v = data[key]
              if isinstance(v, bool):
                  return "true" if v else "false"
              return str(v)

          required = (
              "build_target",
              "build_preset",
              "run_tests",
              "increment",
              "fetch_depth",
              "test_size",
              "test_threads",
              "link_threads",
              "put_build_results_to_cache",
              "collect_coredumps",
              "custom_branch_name",
              "analytics_job_name",
              "source_run_id",
          )
          missing = [k for k in required if not as_str(k).strip()]
          if missing:
              print(f"::error::job_inputs missing required fields: {', '.join(missing)}")
              sys.exit(1)

          out = {k: as_str(k) for k in (
              "build_target",
              "build_preset",
              "run_tests",
              "increment",
              "fetch_depth",
              "test_size",
              "test_type",
              "test_threads",
              "link_threads",
              "test_retry_count",
              "additional_ya_make_args",
              "put_build_results_to_cache",
              "collect_coredumps",
              "custom_branch_name",
              "pull_number",
              "analytics_job_name",
              "source_run_id",
          )}

          platform_run_id = os.environ["PLATFORM_RUN_ID"].strip()
          if out["source_run_id"] != platform_run_id:
              print(
                  f"::error::job_inputs.source_run_id={out['source_run_id']!r} "
                  f"!= platform_run_id={platform_run_id!r}"
              )
              sys.exit(1)

          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as f:
              for k, v in out.items():
                  if "\n" in v or "\r" in v:
                      delim = f"ghadelimiter_{uuid.uuid4().hex}"
                      f.write(f"{k}<<{delim}\n{v}\n{delim}\n")
                  else:
                      f.write(f"{k}={v}\n")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Checkout ydb-platform/ydb
        uses: actions/checkout@v5
        with:
          repository: ydb-platform/ydb
          ref: ${{ inputs.code_ref }}
          fetch-depth: ${{ steps.ya.outputs.fetch_depth }}
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || github.token }}
          persist-credentials: false

      - name: Build and test (platform action from checkout)
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ steps.ya.outputs.build_preset }}
          build_target: ${{ steps.ya.outputs.build_target }}
          run_tests: ${{ steps.ya.outputs.run_tests }}
          increment: ${{ steps.ya.outputs.increment }}
          test_size: ${{ steps.ya.outputs.test_size }}
          test_type: ${{ steps.ya.outputs.test_type }}
          test_threads: ${{ steps.ya.outputs.test_threads }}
          link_threads: ${{ steps.ya.outputs.link_threads }}
          test_retry_count: ${{ steps.ya.outputs.test_retry_count }}
          put_build_results_to_cache: ${{ steps.ya.outputs.put_build_results_to_cache }}
          collect_coredumps: ${{ steps.ya.outputs.collect_coredumps }}
          custom_branch_name: ${{ steps.ya.outputs.custom_branch_name }}
          pull_number: ${{ steps.ya.outputs.pull_number }}
          analytics_job_name: ${{ steps.ya.outputs.analytics_job_name }}
          source_run_id: ${{ steps.ya.outputs.source_run_id }}
          enable_ydb_qa: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ steps.ya.outputs.additional_ya_make_args }}
          secs: >-
            ${{ format('{{"AWS_KEY_ID":{0},"AWS_KEY_VALUE":{1},"REMOTE_CACHE_USERNAME":{2},"REMOTE_CACHE_PASSWORD":{3},"YDBOT_TELEGRAM_BOT_TOKEN":{4}}}',
              toJSON(secrets.AWS_KEY_ID), toJSON(secrets.AWS_KEY_VALUE),
              toJSON(secrets.REMOTE_CACHE_USERNAME), toJSON(secrets.REMOTE_CACHE_PASSWORD),
              toJSON(secrets.YDBOT_TELEGRAM_BOT_TOKEN)) }}
          vars: >-
            ${{ format('{{"AWS_BUCKET":{0},"AWS_ENDPOINT":{1},"AWS_REGION":{2},"AWS_PUBLIC_ACL":"false","REMOTE_CACHE_URL":{3},"GH_ALERTS_TG_LOGINS":{4},"GH_ALERTS_TG_CHAT":{5}}}',
              toJSON(vars.AWS_BUCKET), toJSON(vars.AWS_ENDPOINT), toJSON(vars.AWS_REGION),
              toJSON(vars.REMOTE_CACHE_URL_YA), toJSON(vars.GH_ALERTS_TG_LOGINS), toJSON(vars.GH_ALERTS_TG_CHAT)) }}

      - name: Publish remote artifacts locator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_DIR:-}" ] || [ ! -d "$PUBLIC_DIR" ]; then
            echo "::warning::PUBLIC_DIR missing; skip remote artifacts locator"
            exit 0
          fi
          if [ -z "${S3_BUCKET_PATH:-}" ]; then
            echo "::warning::S3_BUCKET_PATH missing; skip remote artifacts locator"
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          public = Path(os.environ["PUBLIC_DIR"])
          links = public / "summary_links.txt"
          out = public / "job_summary.md"
          parts = []
          if links.is_file():
              rows = []
              for line in links.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  n, _, rest = line.partition(" ")
                  rows.append((int(n), rest))
              parts.append(" | ".join(v for _, v in sorted(rows)))
              parts.append("")
          text = public / "summary_text.txt"
          if text.is_file():
              parts.append(text.read_text(encoding="utf-8").rstrip() + "\n")
          out.write_text("\n".join(parts), encoding="utf-8")
          print(f"wrote {out} ({out.stat().st_size} bytes)")
          PY
          REMOTE_ARTIFACTS_JSON="$PUBLIC_DIR/remote_artifacts.json"
          REMOTE_ARTIFACTS_JSON="$REMOTE_ARTIFACTS_JSON" \
            python3 .github/scripts/ci/remote_executor/write_remote_artifacts_manifest.py
          RUN_ROOT="${S3_BUCKET_PATH%/}"
          RUN_ROOT="${RUN_ROOT%/*}"
          # shellcheck disable=SC2086
          s3cmd put ${S3_PUBLIC_ACL_FLAG:-} --no-progress --no-mime-magic --guess-mime-type \
            "$PUBLIC_DIR/job_summary.md" "${RUN_ROOT}/job_summary.md"
          # shellcheck disable=SC2086
          s3cmd put ${S3_PUBLIC_ACL_FLAG:-} --no-progress --no-mime-magic --guess-mime-type \
            "$REMOTE_ARTIFACTS_JSON" "${RUN_ROOT}/remote_artifacts.json"
          echo "::notice title=Remote artifacts::${RUN_ROOT}/remote_artifacts.json"
