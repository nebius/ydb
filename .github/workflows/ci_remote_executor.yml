# Thin Nebius host: checkout ydb-platform/ydb@code_ref, run build_and_test_ya from that tree.
# Do not sync platform .github here. Inputs normally come from ci_remote_pull_poller
# (platform artifact remote-ticket). See .github/scripts/ci/REMOTE_PULL.md.
name: CI remote executor

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: 'ydb-platform/ydb ref/SHA to checkout and test'
        required: false
        type: string
        default: 'main'
      job_inputs:
        description: 'JSON object of build_and_test_ya public params (no secrets)'
        required: false
        type: string
        default: '{}'
      runs_on:
        description: 'JSON array of GitHub runs-on labels'
        required: false
        type: string
        default: '["self-hosted","linux","amd64-large"]'

concurrency:
  # Keep under GitHub's 400-char limit (do not embed full job_inputs JSON).
  group: ci-remote-executor-${{ inputs.code_ref || github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  execute:
    name: build_and_test_ya · ${{ inputs.code_ref }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 1200
    steps:
      - name: Parse job_inputs
        id: ya
        env:
          JOB_INPUTS: ${{ inputs.job_inputs }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ.get("JOB_INPUTS") or "{}"
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::job_inputs is not valid JSON: {e}")
              sys.exit(1)
          if not isinstance(data, dict):
              print("::error::job_inputs must be a JSON object")
              sys.exit(1)

          def as_str(key, default=""):
              if key not in data or data[key] is None:
                  return default
              v = data[key]
              if isinstance(v, bool):
                  return "true" if v else "false"
              return str(v)

          defaults = {
              "build_target": "ydb/",
              "build_preset": "relwithdebinfo",
              "run_tests": "true",
              "increment": "false",
              "fetch_depth": "2",
              "test_size": "small,medium",
              "test_type": "",
              "test_threads": "64",
              "link_threads": "2",
              "test_retry_count": "",
              "additional_ya_make_args": "",
              "put_build_results_to_cache": "true",
              # Match run_tests / build_and_test_ya default.
              "collect_coredumps": "true",
              # Test-history / ya GIT_BRANCH (must NOT be the Nebius host ref).
              "custom_branch_name": "",
              # PR attribution for analytics (workflow_dispatch has no github.event.number).
              "pull_number": "",
              "add_vcs_info": "false",
              # Mute/BI job_name when github.workflow is the thin host (e.g. Regression-run_Large).
              "analytics_job_name": "",
              # Caller event/run for analytics pull naming (this host is always workflow_dispatch).
              "source_event_name": "",
              "source_run_id": "",
          }
          out = {k: as_str(k, d) for k, d in defaults.items()}
          if out["increment"].lower() in ("1", "true", "yes"):
              out["fetch_depth"] = "0"
          if not out["custom_branch_name"]:
              print(
                  "::warning::job_inputs.custom_branch_name is empty; "
                  "analytics may attribute this run to the Nebius host ref"
              )
          if not out["analytics_job_name"]:
              print(
                  "::warning::job_inputs.analytics_job_name is empty; "
                  "analytics job_name will be this workflow's name"
              )

          # blacklist_paths: string (newline/comma) or JSON list → temp yaml for ya.
          raw_bl = data.get("blacklist_paths") or ""
          if isinstance(raw_bl, list):
              bl_paths = [str(p).strip() for p in raw_bl if str(p).strip()]
          else:
              bl_paths = [
                  p.strip()
                  for p in str(raw_bl).replace(",", "\n").splitlines()
                  if p.strip()
              ]
          out["blacklist_file"] = ""
          if bl_paths:
              bl_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "test_blacklist.yaml")
              with open(bl_path, "w", encoding="utf-8") as bf:
                  for p in bl_paths:
                      bf.write(f"- path: {p}\n")
              out["blacklist_file"] = bl_path
              print(f"blacklist_file={bl_path} paths={bl_paths}")

          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Resolve code_ref
        id: ref
        shell: bash
        run: |
          code_ref='${{ inputs.code_ref }}'
          if [ -z "$code_ref" ]; then
            code_ref='main'
          fi
          echo "code=$code_ref" >> "$GITHUB_OUTPUT"
          {
            echo "### CI remote executor (nebius)"
            echo "- **platform repo:** \`ydb-platform/ydb\`"
            echo "- **code ref:** \`$code_ref\`"
            echo "- **analytics branch:** \`${{ steps.ya.outputs.custom_branch_name }}\`"
            echo "- **analytics job:** \`${{ steps.ya.outputs.analytics_job_name }}\`"
            echo "- **pull number:** \`${{ steps.ya.outputs.pull_number }}\`"
            echo "- **source event:** \`${{ steps.ya.outputs.source_event_name }}\` / \`${{ steps.ya.outputs.source_run_id }}\`"
            echo "- **preset:** \`${{ steps.ya.outputs.build_preset }}\`"
            echo "- **target:** \`${{ steps.ya.outputs.build_target }}\`"
            echo "- **runs_on:** \`${{ inputs.runs_on }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout ydb-platform/ydb
        uses: actions/checkout@v7
        with:
          repository: ydb-platform/ydb
          ref: ${{ steps.ref.outputs.code }}
          fetch-depth: ${{ steps.ya.outputs.fetch_depth }}
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || github.token }}
          persist-credentials: false

      # No Setup ydb access: Nebius must not read/write YC YDB QA.
      # Host S3/cache come from this repo's secrets/vars below.
      - name: Build and test (platform action from checkout)
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ steps.ya.outputs.build_preset }}
          build_target: ${{ steps.ya.outputs.build_target }}
          run_tests: ${{ steps.ya.outputs.run_tests }}
          increment: ${{ steps.ya.outputs.increment }}
          test_size: ${{ steps.ya.outputs.test_size }}
          test_type: ${{ steps.ya.outputs.test_type }}
          test_threads: ${{ steps.ya.outputs.test_threads }}
          link_threads: ${{ steps.ya.outputs.link_threads }}
          test_retry_count: ${{ steps.ya.outputs.test_retry_count }}
          put_build_results_to_cache: ${{ steps.ya.outputs.put_build_results_to_cache }}
          collect_coredumps: ${{ steps.ya.outputs.collect_coredumps }}
          custom_branch_name: ${{ steps.ya.outputs.custom_branch_name }}
          pull_number: ${{ steps.ya.outputs.pull_number }}
          add_vcs_info: ${{ steps.ya.outputs.add_vcs_info }}
          analytics_job_name: ${{ steps.ya.outputs.analytics_job_name }}
          source_event_name: ${{ steps.ya.outputs.source_event_name }}
          source_run_id: ${{ steps.ya.outputs.source_run_id }}
          enable_ydb_qa: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ steps.ya.outputs.additional_ya_make_args }} ${{ steps.ya.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.ya.outputs.blacklist_file) || '' }}
          secs: >-
            ${{ format('{{"AWS_KEY_ID":{0},"AWS_KEY_VALUE":{1},"REMOTE_CACHE_USERNAME":{2},"REMOTE_CACHE_PASSWORD":{3},"YDBOT_TELEGRAM_BOT_TOKEN":{4}}}',
              toJSON(secrets.AWS_KEY_ID), toJSON(secrets.AWS_KEY_VALUE),
              toJSON(secrets.REMOTE_CACHE_USERNAME), toJSON(secrets.REMOTE_CACHE_PASSWORD),
              toJSON(secrets.YDBOT_TELEGRAM_BOT_TOKEN)) }}
          vars: >-
            ${{ format('{{"AWS_BUCKET":{0},"AWS_ENDPOINT":{1},"AWS_REGION":{2},"REMOTE_CACHE_URL":{3},"GH_ALERTS_TG_LOGINS":{4},"GH_ALERTS_TG_CHAT":{5}}}',
              toJSON(vars.AWS_BUCKET), toJSON(vars.AWS_ENDPOINT), toJSON(vars.AWS_REGION),
              toJSON(vars.REMOTE_CACHE_URL_YA), toJSON(vars.GH_ALERTS_TG_LOGINS), toJSON(vars.GH_ALERTS_TG_CHAT)) }}
