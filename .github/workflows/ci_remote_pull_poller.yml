# Claim platform remote-ticket artifacts and start ci_remote_executor.
# Needs:
#   secrets.GH_DISPATCH_TOKEN — PAT/app on THIS repo (workflow_dispatch; github.token will not start workflows)
#   secrets.PLATFORM_GH_TOKEN — actions:read on platform repo (artifacts)
# Webhook proxy can fire repository_dispatch type platform_remote_ticket with
# client_payload.platform_run_id.
name: CI remote pull poller

on:
  workflow_dispatch:
    inputs:
      platform_run_id:
        description: 'Optional single platform run id. Empty = scan open runs once.'
        required: false
        type: string
        default: ''
  repository_dispatch:
    types: [platform_remote_ticket]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/s3cmd
          sparse-checkout-cone-mode: false

      - name: Configure claim s3cmd
        uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ vars.AWS_BUCKET }}
          s3_endpoint: ${{ vars.AWS_ENDPOINT }}
          build_preset: relwithdebinfo

      - name: Claim remote-ticket → dispatch executor
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          PLATFORM_GH_TOKEN: ${{ secrets.PLATFORM_GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLATFORM_REPOSITORY: ${{ vars.PLATFORM_REPOSITORY || 'ydb-platform/ydb' }}
          PLATFORM_RUN_ID: ${{ inputs.platform_run_id || github.event.client_payload.platform_run_id || '' }}
          CLAIM_S3_BUCKET: ${{ vars.AWS_BUCKET }}
          CLAIM_PUBLIC_BASE: ${{ vars.CLAIM_PUBLIC_BASE }}
          TICKET_BASE_URL: ${{ vars.TICKET_BASE_URL }}
          PLATFORM_WORKFLOW_NAMES: ${{ vars.PLATFORM_WORKFLOW_NAMES || 'Run and debug tests' }}
          WORKFLOW_FILE: ci_remote_executor.yml
          EXECUTOR_REF: ${{ vars.EXECUTOR_REF || 'nebius-ci' }}
        run: python3 .github/scripts/ci/remote_pull_poller.py
